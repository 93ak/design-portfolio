<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vlackvink | Video Editor & Motion Graphics Portfolio</title>
    <link rel="icon" type="image/png" href="public/images/favicon.png" />
    <meta
      name="description"
      content="Portfolio of Vlackvink featuring video edits, posters, and creative projects."
    />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://vlackvink.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:title" content="Vlackvink" />
    <meta
      property="og:description"
      content="Portfolio featuring video edits, posters, and creative motion graphics."
    />
    <meta
      property="og:image"
      content="https://vlackvink.vercel.app/images/preview.png"
    />
    <meta
      property="og:url"
      content="https://vlackvink.vercel.app/"
    />
    <meta property="og:type" content="website" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vlackvink" />
    <meta
      name="twitter:description"
      content="Portfolio featuring video edits, posters, and creative projects."
    />
    <meta
      name="twitter:image"
      content="https://vlackvink.vercel.app/images/preview.png"
    />

    <script>
      // Restore path after GitHub Pages 404 redirect
      (function() {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
    <style>
      @font-face {
        font-family: 'LemonMilk';
        src: url('fonts/LEMONMILK-Medium.otf') format('opentype');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'LemonMilk';
        src: url('fonts/LEMONMILK-Medium.otf') format('opentype');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --font-brand: 'LemonMilk', sans-serif;
        --font-body: Helvetica, Arial, sans-serif;
        --color-pink: #FF06C2;
        --color-cyan: #00F5DF;
        --color-navy: #000819;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        background-color: var(--color-navy);
        font-family: var(--font-body);
        color: white;
        overflow-x: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
